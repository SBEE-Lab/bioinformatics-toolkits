name: Check README

on:
  pull_request:
    paths:
      - "packages/**"
      - "scripts/generate-package-docs.py"
      - "scripts/package-docs-metadata*.nix"
      - "README.md"
      - ".github/workflows/check-readme.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Verify generated package documentation
        run: |
          python3 scripts/generate-package-docs.py
          git diff --exit-code README.md

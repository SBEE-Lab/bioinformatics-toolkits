name: Check README

on:
  pull_request:
    paths:
      - "packages/**"
      - "scripts/generate-package-docs.nu"
      - "scripts/generate-package-docs.nix"
      - "README.md"
      - ".github/workflows/check-readme.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Verify generated package documentation
        run: nix develop -c scripts/generate-package-docs.nu --check

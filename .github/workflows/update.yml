name: Update packages

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      packages:
        description: Space-separated packages to update; empty selects all
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has-updates: ${{ steps.matrix.outputs.has-updates }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - id: matrix
        name: Discover packages
        env:
          PACKAGES: ${{ inputs.packages }}
        run: .github/ci/discovery.py

  update:
    needs: discover
    if: needs.discover.outputs.has-updates == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Prepare update branch
        run: |
          branch="update/${{ matrix.name }}"
          git fetch origin main
          if git fetch origin "$branch"; then
            git checkout -B "$branch" "origin/$branch"
            if ! git rebase origin/main; then
              git rebase --abort
              git reset --hard origin/main
            fi
          else
            git checkout -B "$branch" origin/main
          fi
      - id: update
        name: Update package
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix develop -c .github/ci/update.py "${{ matrix.name }}"
      - name: Create or update pull request
        if: steps.update.outputs.updated == 'true'
        env:
          AUTO_MERGE: "true"
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/ci/create_pr.py \
            "${{ matrix.name }}" \
            "${{ matrix.current_version }}" \
            "${{ steps.update.outputs.new_version }}"

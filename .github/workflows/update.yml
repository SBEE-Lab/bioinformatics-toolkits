name: Update packages

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      packages:
        description: Space-separated packages to update; empty selects all
        required: false
        default: ""

jobs:
  update:
    uses: ./.github/workflows/update-flake.yml
    with:
      packages: ${{ inputs.packages }}
    secrets:
      app_private_key: ${{ secrets.SBEE_FLAKE_UPDATER_PRIVATE_KEY }}
    permissions:
      contents: read
